# cargo-deny 配置
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# 忽略非关键的安全警告（这些是 transitive 依赖的问题）
ignore = [
    "RUSTSEC-2024-0436", # paste unmaintained (transitive dependency; no maintained release)
    # REVIEW-BY 2027-01-13: dbnexus 0.2.0 requires its permission feature for
    # session compilation, which currently pulls serde_yaml_ng/unsafe-libyaml.
    # Version 0.2.11 includes the fix for RUSTSEC-2023-0075; this exception is
    # limited to the no-fix unmaintained notice and must be removed when
    # dbnexus decouples session support from YAML permission parsing.
    "RUSTSEC-2024-0449",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",        # for foldhash (hashbrown dependency)
    "CC0-1.0",     # for tiny-keccak (arrow/parquet transitive dependency)
    "Unicode-3.0", # for icu* crates (url/reqwest dependency)
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/Kirky-X/confers.git",
    "https://github.com/Kirky-X/dbnexus.git",
    "https://github.com/Kirky-X/oxcache.git",
]
