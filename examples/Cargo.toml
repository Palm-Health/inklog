[package]
name = "inklog-examples"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false
description = "Examples for inklog - Enterprise-grade Rust logging infrastructure"

[features]
dbnexus = ["inklog/dbnexus", "dep:dbnexus"]

[dependencies]
inklog = { path = "..", features = ["dbnexus"] }
dbnexus = { git = "https://github.com/Kirky-X/dbnexus.git", rev = "54515bd3ef56a9f2024c69740b3866618c5fe577", default-features = false, features = ["sqlite", "permission", "cache"], optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.20", features = ["v4"] }
chrono = "0.4.44"
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand = "0.10.0"
tempfile = "3.27.0"

[patch.crates-io]
oxcache = { git = "https://github.com/Kirky-X/oxcache.git", rev = "a726caeb17c09a605628af275c1edb39f8fdba2c" }

[[bin]]
name = "console"
path = "src/bin/console.rs"

[[bin]]
name = "file"
path = "src/bin/file.rs"

[[bin]]
name = "encryption"
path = "src/bin/encryption.rs"

[[bin]]
name = "performance"
path = "src/bin/performance.rs"

[[bin]]
name = "database"
path = "src/bin/database.rs"

[[bin]]
name = "http"
path = "src/bin/http.rs"

[[bin]]
name = "fallback"
path = "src/bin/fallback.rs"

[[bin]]
name = "s3_archive"
path = "src/bin/s3_archive.rs"

# 现有 binary（保留）
[[bin]]
name = "basic"
path = "src/bin/basic.rs"

[[bin]]
name = "production"
path = "src/bin/production.rs"

[[bin]]
name = "all_features"
path = "src/bin/all_features.rs"

# Layer 0 零依赖示例
[[bin]]
name = "builder"
path = "src/bin/builder.rs"

[[bin]]
name = "template"
path = "src/bin/template.rs"

[[bin]]
name = "masking"
path = "src/bin/masking.rs"
