[package]
name = "inklog"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Kirky.X"]
description = "Enterprise-grade Rust logging infrastructure"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kirky-X/inklog"

[package.metadata.docs.rs]
features = ["default", "aws", "http", "cli", "confers"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"permission\", \"sqlite\", \"postgres\", \"mysql\"))"] }

[features]
default = ["aws", "http", "cli", "confers"]
confers = []
dbnexus = ["dep:dbnexus", "dep:sea-orm", "dep:sea-orm-macros"]
http = ["dep:axum"]
test-local = []
aws = [
    "dep:aws-sdk-s3",
    "dep:aws-config",
    "dep:aws-types",
    "dep:aws-credential-types",
    "dep:aws-smithy-async",
    "dep:aws-smithy-checksums",
    "dep:aws-smithy-eventstream",
    "dep:aws-smithy-http",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-json",
    "dep:aws-smithy-observability",
    "dep:aws-smithy-query",
    "dep:aws-smithy-runtime",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-types",
    "dep:aws-smithy-xml",
    "dep:crc",
    "dep:crc-fast",
]
cli = ["dep:clap", "dep:glob"]
debug = []
metrics = []

[dependencies]
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "fmt", "registry", "env-filter"] }
tracing-core = "0.1"
crossbeam-channel = "0.5"
tokio = { version = "1.50", features = ["full"] }
rayon = "1.11"
num_cpus = "1.17"
futures = { version = "0.3", features = ["executor"] }
owo-colors = { version = "4.3", features = ["supports-colors"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.9" }
confers = { git = "https://github.com/Kirky-X/confers.git", rev = "0daffe0283292e90bee0f36dfed66172bc328f68", default-features = false, features = ["toml", "env", "validation"] }
thiserror = "2.0"
anyhow = "1.0"
num-traits = "0.2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", optional = true }
uuid = { version = "1.22", features = ["v4"] }
hostname = "0.4"
is-terminal = "0.4"
once_cell = "1.21"
nix = { version = "0.31", features = ["fs"] }
bytes = "1.11"
dirs = "6.0"
parking_lot = "0.12"
oxcache = { git = "https://github.com/Kirky-X/oxcache.git", rev = "a726caeb17c09a605628af275c1edb39f8fdba2c" }
moka = { version = "0.12", default-features = false, features = ["sync"] }
dashmap = "6.1"
zstd = "0.13"
aes-gcm = "0.10"
rand = "0.9"
base64 = "0.22"
parquet = { version = "57.3", features = ["async"] }
arrow-array = "57.3"
arrow-schema = "57.3"
# dbnexus currently requires its permission/cache pair for the session types
# used by Inklog's database sink. SQL parser, macros, config-env, and the rest
# of its default surface are intentionally disabled.
dbnexus = { git = "https://github.com/Kirky-X/dbnexus.git", rev = "54515bd3ef56a9f2024c69740b3866618c5fe577", default-features = false, features = ["sqlite", "permission", "cache"], optional = true }
sea-orm = { version = "=2.0.0-rc.37", default-features = false, features = ["runtime-tokio-native-tls", "with-chrono"], optional = true }
sea-orm-macros = { version = "=2.0.0-rc.37", optional = true }
aws-sdk-s3 = { version = "=1.122.0", default-features = false, features = ["rt-tokio", "http-1x", "default-https-client", "sigv4a"], optional = true }
aws-config = { version = "=1.8.13", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "credentials-process", "sso"], optional = true }
aws-types = { version = "=1.3.11", default-features = false, optional = true }
aws-credential-types = { version = "=1.2.11", default-features = false, optional = true }
# Keep the AWS SDK graph on the newest releases that support the workspace's
# Rust 1.88 toolchain. Cargo's MSRV-aware resolver currently selects newer
# incompatible transitive releases for caret requirements, so these exact
# constraints make the locked compatibility contract explicit.
aws-smithy-async = { version = "=1.2.11", default-features = false, optional = true }
aws-smithy-checksums = { version = "=0.64.3", default-features = false, optional = true }
aws-smithy-eventstream = { version = "=0.60.18", default-features = false, optional = true }
aws-smithy-http = { version = "=0.63.3", default-features = false, optional = true }
aws-smithy-http-client = { version = "=1.1.9", default-features = false, optional = true }
aws-smithy-json = { version = "=0.62.3", default-features = false, optional = true }
aws-smithy-observability = { version = "=0.2.4", default-features = false, optional = true }
aws-smithy-query = { version = "=0.60.13", default-features = false, optional = true }
aws-smithy-runtime = { version = "=1.10.0", default-features = false, optional = true }
aws-smithy-runtime-api = { version = "=1.11.3", default-features = false, optional = true }
aws-smithy-types = { version = "=1.4.3", default-features = false, optional = true }
aws-smithy-xml = { version = "=0.60.13", default-features = false, optional = true }
crc = { version = "=3.3.0", default-features = false, optional = true }
crc-fast = { version = "=1.9.0", default-features = false, optional = true }
flate2 = "1.1"
brotli = "8.0"
lz4 = "1.28"
cron = "0.15"
chrono-tz = "0.10"
tokio-cron-scheduler = "0.15"
zeroize = "1.8"
zeroize_derive = "1.4"
sha2 = "0.10"
pbkdf2 = "0.12"
clap = { version = "4.6", features = ["derive", "env"], optional = true }
glob = { version = "0.3", optional = true }
ipnet = "2.12"
subtle = "2.6"

[dev-dependencies]
tempfile = "3.27"
criterion = { version = "0.8", features = ["async_tokio"] }
serial_test = "3.4"
axum = "0.8"
log = "0.4"
reqwest = { version = "0.13", features = ["json"] }
filetime = "0.2"
bytes = "1.11"
assert_cmd = "2.2"
predicates = "3.1"

[[bench]]
name = "inklog_bench"
harness = false

[[bin]]
name = "inklog-cli"
path = "src/cli/mod.rs"
required-features = ["cli"]

[patch.crates-io]
oxcache = { git = "https://github.com/Kirky-X/oxcache.git", rev = "a726caeb17c09a605628af275c1edb39f8fdba2c" }
